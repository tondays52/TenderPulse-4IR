# TenderPulse 4IR - Production Reverse Proxy Configuration
# High-concurrency Nginx configuration with Gzip compression, WebSocket support, and static asset caching

upstream tenderpulse_backend {
    server app:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost tenderpulse.local _;

    client_max_body_size 100M;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse proxy for FastAPI backend and SPA index
    location / {
        proxy_pass http://tenderpulse_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 15s;
    }

    # Files use stable, un-hashed names. Revalidate them on every request so a
    # deployment cannot leave operators running an outdated application shell.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff)$ {
        proxy_pass http://tenderpulse_backend;
        proxy_set_header Host $host;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # API Health Check Endpoint
    location = /api/health {
        proxy_pass http://tenderpulse_backend/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
